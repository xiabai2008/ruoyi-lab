server {
    listen 19108;
    server_name 127.0.0.1;
    client_max_body_size 100m;

    access_log logs/R8_access.log main;

    # RuoYi-Cloud 官方前端形态：Vue SPA 静态资源 + /prod-api 反代到网关
    # （官方 docker/nginx/conf/nginx.conf 就是 root + try_files，再加 /prod-api/ -> gateway:8080/）
    location / {
        root C:/Users/HZR/Desktop/若依系统/runtime/R8/ui;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 前端请求前缀 /prod-api/ 转发到网关（19208），去掉前缀后由网关路由
    # /prod-api/auth/login -> 网关 /auth/login -> lb://ruoyi-auth
    # /prod-api/system/user/getInfo -> 网关 /system/user/getInfo -> lb://ruoyi-system
    # /prod-api/code -> 网关本地 RouterFunction（验证码）
    location /prod-api/ {
        proxy_pass http://127.0.0.1:19208/;
        # 必须用 $http_host（带端口），用 $host 会丢 19108 导致 302 跳 :80
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
