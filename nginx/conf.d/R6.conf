server {
    listen 19106;
    server_name 127.0.0.1;
    client_max_body_size 100m;

    access_log logs/R6_access.log main;

    # RuoYi-Vue 官方 Nginx 配置：前端为 Vue SPA，根路径指向构建产物
    location / {
        root C:/Users/HZR/Desktop/若依系统/runtime/R6/ui;
        index index.html;
        # 官方配置就是 try_files 兜底：未知路径回 index.html（200）
        # 这与单机版（302 -> 登录页）不同，是前后端分离版特有的「SPA 兜底路由」
        try_files $uri $uri/ /index.html;
    }

    # 前端请求前缀 /prod-api/ 转发到后端
    location /prod-api/ {
        proxy_pass http://127.0.0.1:19206/;
        # 必须用 $http_host（带端口），用 $host 会丢 19106
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 2026-11-01 移除「运维便利映射」。
    #
    # 原先这里把 /system|/monitor|/common|/tool|/profile|/resource 以及 /getInfo|/login|
    # /captchaImage 等在根路径又反代了一份，注释写着「方便 curl / 第三方工具直连」。
    # 这正是「为迁就扫描器而改靶场」的典型 —— 真实若依 Vue 版官方 nginx 模板
    # 只反代 /prod-api/，根路径全部交给 SPA 的 try_files 兜底。
    #
    # 保留它的副作用是掩盖扫描器的真实短板：
    #   1. detect_api_base 在根路径就探到 /captchaImage，误判「根路径直连后端」返回 ""
    #   2. 于是插件不再尝试 /prod-api，/prod-api/v3/api-docs 等真实暴露面被漏掉
    #   3. /prod-api/register 打不到，注册开关的判定也失真
    #
    # 移掉后 R6 与 R7 形态一致（官方形态），base-path 探测能力才测得准。
}
