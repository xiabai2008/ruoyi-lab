server {
    listen 19106;
    server_name 127.0.0.1;
    client_max_body_size 100m;

    access_log logs/R6_access.log main;

    # RuoYi-Vue 官方 Nginx 配置：前端为 Vue SPA，根路径指向构建产物
    location / {
        root C:/Users/HZR/Desktop/若依系统/runtime/R6/ui;
        index index.html;
        # 官方配置就是 try_files 兜底：未知路径回 index.html（200）
        # 这与单机版（302 -> 登录页）不同，是前后端分离版特有的「SPA 兜底路由」
        try_files $uri $uri/ /index.html;
    }

    # 前端请求前缀 /prod-api/ 转发到后端
    location /prod-api/ {
        proxy_pass http://127.0.0.1:19206/;
        # 必须用 $http_host（带端口），用 $host 会丢 19106
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 运维便利配置：把后端接口在根路径再暴露一份，方便 curl / 第三方工具直连。
    # 前端本身走 /prod-api/，这条是给运维和扫描器用的。
    # 注意：带子路径的前缀要匹配 "/" 或结尾，否则 /systemx 也会被代理过去。
    location ~ ^/(system|monitor|common|tool|profile|resource)(/|$) {
        proxy_pass http://127.0.0.1:19206;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 无子路径的单点接口
    location ~ ^/(getInfo|login|register|logout|captchaImage|captcha)$ {
        proxy_pass http://127.0.0.1:19206;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
