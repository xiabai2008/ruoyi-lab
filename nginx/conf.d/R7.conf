server {
    listen 19107;
    server_name 127.0.0.1;
    client_max_body_size 100m;

    access_log logs/R7_access.log main;

    # RuoYi-Vue 前后端分离：前端为 Vue SPA，根路径指向构建产物
    location / {
        root C:/Users/HZR/Desktop/若依系统/runtime/R7/ui;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2024 上线时的配置：Nginx 只反代 /prod-api，不额外暴露后端其它路径
    location /prod-api/ {
        proxy_pass http://127.0.0.1:19207/;
        # 必须用 $http_host（带端口），用 $host 会丢 19107
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
