server {
    listen 19110;
    server_name 127.0.0.1;
    client_max_body_size 50m;

    access_log logs/R10_access.log main;

    # 前端 dist（jeecgboot-vue3）
    location / {
        root ../runtime/R10/ui;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 兼容「客户端把 JeecgBoot context-path 重复拼接」的请求：
    #   /jeecg-boot/jeecg-boot/xxx -> 后端 /jeecg-boot/xxx
    # 现实里常见于前端写死 /jeecg-boot 前缀、网关又统一加了 API base 的部署；
    # 扫描器（ruoyi-scan 1.5.4）对 JeecgBoot 会把插件探测基准提升为 http://host/jeecg-boot/，
    # 而 JeecgBoot 专项插件内部又写死 /jeecg-boot，于是产生双前缀。
    # 这里做一次路径归一，不改变后端路由与鉴权。
    location /jeecg-boot/jeecg-boot/ {
        rewrite ^/jeecg-boot/jeecg-boot/(.*)$ /jeecg-boot/$1 break;
        proxy_pass http://127.0.0.1:19210;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # JeecgBoot 后端 context-path 是 /jeecg-boot
    location /jeecg-boot/ {
        proxy_pass http://127.0.0.1:19210/jeecg-boot/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 在线用户/站内信的 WebSocket（后端 @ServerEndpoint("/websocket/{userId}")）。
    # 不做 Upgrade 转发的话握手会 404，控制台一直刷红字。
    location /jeecg-boot/websocket/ {
        proxy_pass http://127.0.0.1:19210/jeecg-boot/websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
