# R12 顺捷物流（网关前置）：与 R2 共用后端 19202，前面加一层带规则的 Nginx（模拟商业 WAF）
server {
    listen 19112;
    server_name 127.0.0.1;
    client_max_body_size 100m;

    access_log logs/R12_access.log main;

    # 攻击特征拦截（只拦明显 payload，不影响正常业务请求）
    # 覆盖：路径穿越、union select、模板表达式、Runtime 执行、java.lang 调用
    if ($request_uri ~* "(\.\./|union(\s|%20|\+)+select|%24%7b|\$\{|runtime\.getruntime|runtime%2egetruntime|java\.lang\.|java%2elang%2e)") {
        return 403;
    }
    if ($args ~* "(\.\./|union(\s|%20|\+)+select|%24%7b|\$\{|runtime\.getruntime|java\.lang\.)") {
        return 403;
    }

    # 拦截页：走命名 location 直接返回 HTML。
    # 之前用 error_page + root html + internal 的写法在 Windows 上没生效
    # （server 级 if 里的 return 403 没触发内部跳转），改成命名 location 后稳定。
    error_page 403 @waf_block;

    location @waf_block {
        default_type text/html;
        charset utf-8;
        return 403 '<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>访问被拒绝</title>
<style>
body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f5f6f8;color:#333}
.box{max-width:720px;margin:120px auto;background:#fff;border:1px solid #e3e6eb;padding:48px}
h1{font-size:22px;margin:0 0 16px}
p{line-height:1.9;color:#666;margin:8px 0}
.code{color:#999;font-size:13px;margin-top:28px}
</style>
</head>
<body>
<div class="box">
<h1>访问被拒绝</h1>
<p>您的请求包含被安全策略禁止的内容，已被网关拦截。</p>
<p>如果您认为这是一次误拦截，请联系系统管理员并提供访问时间与请求地址。</p>
<p class="code">Request ID: 8f3c2a7e-4b1d-4c9a-9e6f-waf</p>
</div>
</body>
</html>';
    }

    location / {
        proxy_pass http://127.0.0.1:19202;
        # 必须用 $http_host：$host 会丢掉 19112 端口，Shiro 的 302 会跳到 :80
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
