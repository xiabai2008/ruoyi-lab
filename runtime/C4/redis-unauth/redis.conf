# C4-1 Redis 未授权靶场（16379）
#
# 刻意复现真实生产事故的典型形态：
#   - 没有 requirepass（Redis 默认值就是空，即无密码）
#   - bind 0.0.0.0（默认为注释态，等价于监听全部网卡）
#   - protected-mode no（安装时为了"方便远程连"手工关掉的常见操作）
#
# 这三条不是"为扫描器造的"，而是运维最常见的三步错误操作，
# 也是 Redis 未授权访问（CNVD/OWASP 高频项）的实际成因。

port 16379
bind 0.0.0.0
protected-mode no
daemonize no
dir ./
dbfilename c4-unauth.rdb
appendonly no
save ""
loglevel notice
logfile ""
